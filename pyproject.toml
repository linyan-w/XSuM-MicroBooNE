[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xsum-microboone"
version = "0.0.1"
description = "XSuM-MicroBooNE: a surrogate detector model for the MicroBooNE open samples"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["xsum", "xsum.io", "xsum.prep", "xsum.data"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
